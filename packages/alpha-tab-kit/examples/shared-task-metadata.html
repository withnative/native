<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared task metadata</title>
<script type="application/json" id="native-app-kit">{"schema":"native.app-kit.v1","major":1}</script>
<style>body{font:16px/1.5 system-ui,sans-serif;margin:2rem auto;max-width:46rem;color:#1f2a33}main{display:block}label{display:block;margin:.6rem 0}input,textarea,button{font:inherit;padding:.45rem .6rem}textarea{width:100%;min-height:3.5rem;box-sizing:border-box}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}.row{border:1px solid #b9c4cc;padding:.8rem 1rem;margin:.8rem 0}.meta{margin:.3rem 0}.note{color:#4a5a64;font-size:.9rem}.error{color:#8f1d26}.status{margin:.5rem 0}</style>
</head><body><main><h1>Shared task metadata</h1><p>Update one task's name, summary, or lifecycle through a fixed steps query.</p><div id="app">Opening Native…</div></main>
<script type="module">
// Shared task metadata: one shared WorkItem/task field update through a
// fixed steps query, using only the public supplied core 1.7 API:
// preact.useQueryFeed(StepsQuery) + rowsOf + useWrite/WriteStatus.
// See docs/shared-field-updates.md for the author guide.
// Fixed bounded IDs: exactly the task(s) the author chooses, no lifecycle
// filter (localQuery declines it), no body/created_at/updated_at_ms/
// is_current columns. Replace TASK_ID below with an actual known workspace
// task id; the app never queries the whole workspace and never predicts
// membership or create.
// Writes send only id/reason/name/summary/lifecycle via update_record.
// Drafts are page-only (helper custody is memory); reload discards them.
// The data-testid hooks below are stable hooks used by the browser proof;
// keep them when editing.
const TASK_ID = 'steps-pilot-task';
const QUERY = { steps: [{ step: 'filter', types: ['WorkItem'], kinds: ['task'], ids: [TASK_ID] }], order: 'name_asc', limit: 200 };
const TOGGLEABLE = { open: 'completed', completed: 'open' };
const kit = window.native?.kit;
const root = document.getElementById('app');
if (!kit?.preact?.useQueryFeed || !kit?.preact?.rowsOf || !kit?.preact?.useWrite) {
  root.textContent = 'Open in Native with core kit 1.7.0.';
} else {
  const { html, render, useState, useEffect, useQueryFeed, rowsOf, useWrite, WriteStatus, FeedNotice, Loading, Empty, ErrorState } = kit.preact;
  function App() {
    const feed = useQueryFeed(QUERY);
    const writer = useWrite({ operation: 'update_record' });
    const snapshot = feed.status === 'ready' ? feed.result : feed.last;
    const rows = rowsOf(snapshot);
    const row = rows.find((item) => item && item.id === TASK_ID) || null;
    const [draft, setDraft] = useState(null);
    const [failure, setFailure] = useState(null);
    // Draft fence: observe the subscribed feed. When the row leaves scope
    // (unsupported host, account/workspace change, record gone), drop the
    // draft and lock submit. Transient trouble keeps last-good rows, so the
    // draft survives it.
    useEffect(() => {
      if (feed.status === 'unsupported' || !row) setDraft(null);
    }, [feed.status, row && row.id]);
    useEffect(() => {
      if (row && !draft) {
        setDraft({ name: row.name || '', summary: row.summary || '', lifecycle: row.lifecycle || 'open', reason: '' });
        setFailure(null);
      }
    }, [row && row.id]);
    if (feed.status === 'unsupported') return html`<section><h2>Task</h2><p role="alert">${feed.message}</p></section>`;
    const busy = writer.entries.some((entry) => entry.status === 'pending' || entry.status === 'uncertain');
    const nextLifecycle = draft ? TOGGLEABLE[draft.lifecycle] : undefined;
    const canSubmit = !!row && !!draft && !busy;
    async function submit() {
      if (!canSubmit) return;
      setFailure(null);
      const ticket = writer.submit({ id: TASK_ID, name: draft.name, summary: draft.summary || null, lifecycle: draft.lifecycle, reason: draft.reason || 'Shared task metadata update' });
      const entry = await ticket.done;
      if (entry.status === 'failed' && entry.error) setFailure(entry.error);
    }
    return html`<section><h2>Task</h2>
      <${FeedNotice} feed=${feed} />
      ${feed.status === 'loading' && !snapshot && html`<${Loading} what="task" />`}
      ${feed.status === 'error' && html`<${ErrorState} error=${feed.error} onRetry=${feed.retry} />`}
      ${snapshot && !row && html`<${Empty}>Task ${TASK_ID} is not loaded in this scope.<//>`}
      ${row && html`<div class="row">
        <p class="meta">Name: <strong data-testid="pilot-name">${row.name || row.id}</strong></p>
        <p class="meta">Lifecycle: <strong data-testid="pilot-lifecycle">${row.lifecycle}</strong></p>
        ${row.summary != null && html`<p class="meta">Summary: <span data-testid="pilot-summary">${row.summary}</span></p>`}
        <p class="note">Shared view (unscoped host, current local store only): every frame here renders the same predicted value before the server answers. Scoped or behind reads fall back to the server and may wait.</p>
      </div>`}
      ${row && draft && html`<div class="row">
        <h3>Edit (this page only)</h3>
        <label>Name <input data-testid="pilot-draft-name" value=${draft.name} disabled=${busy} onInput=${(e) => setDraft({ ...draft, name: e.currentTarget.value })} /></label>
        <label>Summary <textarea data-testid="pilot-draft-summary" value=${draft.summary} disabled=${busy} onInput=${(e) => setDraft({ ...draft, summary: e.currentTarget.value })} /></label>
        ${nextLifecycle
          ? html`<p><button data-testid="pilot-toggle" type="button" disabled=${busy} onClick=${() => setDraft({ ...draft, lifecycle: nextLifecycle })}>Set ${nextLifecycle}</button> <span class="note">draft: ${draft.lifecycle}</span></p>`
          : html`<p class="note" data-testid="pilot-toggle-disabled">Lifecycle “${draft.lifecycle}” is not toggleable in this example; name and summary can still be saved.</p>`}
        <label>Reason <input data-testid="pilot-draft-reason" value=${draft.reason} disabled=${busy} placeholder="Why this change" onInput=${(e) => setDraft({ ...draft, reason: e.currentTarget.value })} /></label>
        <p><button data-testid="pilot-submit" type="button" disabled=${!canSubmit} onClick=${submit}>Save</button></p>
        ${failure && html`<p class="error" role="alert" data-testid="pilot-failure">${failure.message || failure.code || 'Write refused.'} Draft kept; edit and save again.</p>`}
        <p class="note">A submitted request is frozen intent. The helper keeps it in this page's memory; the host-side shared overlay is what every frame renders. Pre-result sharing needs a current unscoped local store — scoped or behind reads fall back to the server and may wait. Reload ends page state: drafts, helper entries, and this frame's overlay view.</p>
      </div>`}
      <div class="status">${writer.entries.map((entry) => html`<${WriteStatus} key=${entry.id} entry=${entry} onRetry=${() => writer.retry(entry.id)} onDiscard=${() => writer.discard(entry.id)} />`)}</div>
    </section>`;
  }
  try { await kit.ready; root.textContent = ''; render(html`<${App} />`, root); }
  catch { root.textContent = 'Native could not initialize this app.'; }
  addEventListener('pagehide', () => render(null, root), { once: true });
}
</script></body></html>

        <details><summary>Exact agent brief and evidence</summary><pre id="exact-prompt">${promptFor(approved)}</pre><h3>Quoted task evidence</h3><pre>${approved.evidence}</pre></details>
        <div class="row"><button id="start" class="primary" disabled=${!readable || noAgents || unresolvedLaunch || !!active || !!results.length} onClick=${start}>Start / recover agent</button><button id="recover" disabled=${noAgents} onClick=${recover}>Check existing conversation</button></div>
        <p class="muted">Starts only on your click. Desktop may ask you to confirm the launch. A retry uses this same saved request.</p>` : html`<p class="empty">Save a brief to choose exactly what the agent receives.</p>`}
      ${launcher.entries.filter(e => e.status !== 'uncertain' || session?.requestKey !== e.request.requestId).map(e => html`<div key=${e.id}><${WriteStatus} entry=${e} onRetry=${e.status === 'uncertain' ? () => launcher.retry(e.id) : undefined} onDiscard=${() => launcher.discard(e.id)} />${e.status === 'failed' && html`<p class="error">${e.error?.message} Save a new brief to try with new choices.</p>`}</div>`)}
      ${active && html`<h3>Conversation ${live?.status ? '· ' + live.status : ''}</h3><button id="open-session" onClick=${() => s.openConversation({ hostId: active.hostId, hostEpoch: live?.hostEpoch || active.hostEpoch, sessionId: active.id })}>Open conversation</button>
        <label>Feedback for this agent<textarea id="followup" maxlength="2000" value=${followup} onInput=${e => setFollowup(e.currentTarget.value)} /></label><button id="send-feedback" disabled=${!readable || !followup.trim() || bytes(followup) > 11000 || !live || !s.isCurrent(live) || s.send.pending} onClick=${() => s.send.submit({ hostId: live.hostId, hostEpoch: live.hostEpoch, sessionId: live.id, text: followup + '\n\nUpdate the existing result linked part_of approved brief ' + approved.id + '; keep it linked there.' })}>Send feedback</button>`}
      ${sendEntries.map(e => html`<${WriteStatus} key=${e.id} entry=${e} onRetry=${() => s.send.retry(e.id)} onDiscard=${() => s.send.discard(e.id)} />`)}
      ${note && html`<p role="status">${note}</p>`}
      </section><section class="step"><span class="eyebrow">4 / Review what came back</span><${ReadNotice} feed=${resultsFeed} subject="Returned-result list" />
      ${!results.length && html`<p class="empty">${active ? 'The conversation has started. A result appears when the agent saves it to Native.' : 'Results appear here, linked to their approved brief.'}</p>`}
      ${results.map(result => html`<article class="result" key=${result.id}><h3>${result.name}</h3><${RecordLink} id=${result.id}>Open result</${RecordLink}><${Markdown} source=${result.body || ''} />${result.body_length > 24000 && html`<p class="muted">Result preview shortened. Open the record to read it all.</p>`}</article>`)}
      <p class="muted">A started or idle conversation is not a completed task. Returned results stay in Native; you decide what to do next.</p></section>`;
  }
  try { await kit.ready; root.textContent = ''; render(html`<${App} />`, root); }
  catch { root.textContent = 'Native could not open this work queue.'; }
  addEventListener('pagehide', () => { render(null, root); store.dispose(); }, { once: true });
}
</script></body></html>

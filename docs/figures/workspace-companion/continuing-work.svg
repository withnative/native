<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 506" role="img" aria-labelledby="title desc">
<title id="title">The next agent can recover the changed decision</title>
<desc id="desc">An original broad-release decision is superseded by a postponement, linked to trial findings and a follow-up task. A later agent can read the correction and continue. Recording and retrieval are deliberate.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#e2231a"/></marker></defs>
<rect width="600" height="506" fill="#f7f6f2"/>
<g font-family="Inter, Arial, sans-serif">
<text x="24" y="36" font-size="18" fill="#161616" font-weight="600">03 / A CORRECTION THAT CAN BE RECOVERED</text><rect x="24" y="58" width="552" height="72" fill="#fff" stroke="#b8b6b0"/><text x="44" y="89" font-size="20" fill="#555" font-weight="400">Original decision</text><text x="44" y="116" font-size="24" fill="#161616" font-weight="600">Release to everyone</text><path d="M300 130 L300 178" fill="none" stroke="#e2231a" stroke-width="2" marker-end="url(#arrow)"/><text x="322" y="163" font-size="18" fill="#555" font-weight="400">superseded by</text><rect x="24" y="196" width="552" height="103" fill="#fff" stroke="#b8b6b0"/><text x="44" y="228" font-size="20" fill="#555" font-weight="400">Revised decision</text><text x="44" y="260" font-size="24" fill="#161616" font-weight="600">Postpone; resolve onboarding</text><text x="44" y="285" font-size="19" fill="#161616" font-weight="400">Linked to the trial findings and follow-up task</text><path d="M300 299 L300 341" fill="none" stroke="#e2231a" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="359" width="552" height="81" fill="#fff" stroke="#b8b6b0"/><text x="44" y="391" font-size="20" fill="#555" font-weight="400">Later agent</text><text x="44" y="422" font-size="24" fill="#161616" font-weight="600">Reads the correction and continues</text><text x="24" y="483" font-size="18" fill="#555" font-weight="400">ILLUSTRATION / Recorded change, retrieved later.</text>
</g>
</svg>

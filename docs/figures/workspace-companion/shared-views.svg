<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 604" role="img" aria-labelledby="title desc">
<title id="title">One project, three views</title>
<desc id="desc">A shared set of launch tasks, decisions and trial evidence feeds a dependency map, a timeline and a briefing. These are illustrative views, not product screenshots.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#e2231a"/></marker></defs>
<rect width="600" height="604" fill="#f7f6f2"/>
<g font-family="Inter, Arial, sans-serif">
<text x="24" y="36" font-size="18" fill="#161616" font-weight="600">01 / SAME PROJECT, DIFFERENT QUESTIONS</text><rect x="24" y="58" width="552" height="100" fill="#fff" stroke="#b8b6b0"/><text x="44" y="90" font-size="24" fill="#161616" font-weight="600">Shared launch records</text><text x="44" y="126" font-size="22" fill="#161616" font-weight="400">Tasks  ·  Decisions  ·  Trial evidence</text><path d="M300 158 V179 H24 V487" fill="none" stroke="#e2231a" stroke-width="2"/><path d="M24 251 L52 251" fill="none" stroke="#e2231a" stroke-width="2" marker-end="url(#arrow)"/><rect x="66" y="211" width="510" height="94" fill="#fff" stroke="#b8b6b0"/><text x="84" y="245" font-size="24" fill="#161616" font-weight="600">Dependency map</text><text x="84" y="278" font-size="19" fill="#161616" font-weight="400">What could delay us?</text><path d="M24 369 L52 369" fill="none" stroke="#e2231a" stroke-width="2" marker-end="url(#arrow)"/><rect x="66" y="329" width="510" height="94" fill="#fff" stroke="#b8b6b0"/><text x="84" y="363" font-size="24" fill="#161616" font-weight="600">Timeline</text><text x="84" y="396" font-size="19" fill="#161616" font-weight="400">What happens this week?</text><path d="M24 487 L52 487" fill="none" stroke="#e2231a" stroke-width="2" marker-end="url(#arrow)"/><rect x="66" y="447" width="510" height="94" fill="#fff" stroke="#b8b6b0"/><text x="84" y="481" font-size="24" fill="#161616" font-weight="600">Briefing</text><text x="84" y="514" font-size="19" fill="#161616" font-weight="400">What needs a decision?</text><g fill="#f7f6f2" stroke="#161616" stroke-width="1.5"><path d="M427 250 L471 237 L526 264" fill="none"/><rect x="416" y="240" width="23" height="23"/><rect x="460" y="226" width="23" height="23"/><rect x="515" y="252" width="23" height="23"/></g><g fill="#161616"><rect x="414" y="350" width="62" height="10"/><rect x="448" y="369" width="66" height="10"/><rect x="493" y="388" width="44" height="10"/></g><g fill="#161616"><rect x="414" y="470" width="6" height="6"/><rect x="429" y="470" width="108" height="3"/><rect x="429" y="483" width="72" height="3"/><rect x="414" y="503" width="6" height="6"/><rect x="429" y="503" width="108" height="3"/><rect x="429" y="516" width="84" height="3"/></g><text x="24" y="581" font-size="18" fill="#555" font-weight="400">ILLUSTRATION / Each view reads shared records.</text>

[package]
name = "native-package-cel-host"
version = "0.1.0"
edition = "2021"
publish = false
repository = "https://github.com/withnative/native"
rust-version = "1.98"
[dependencies]
native-package-cel-wire = { path = "../package-cel-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasmparser = "=0.258.3"
wasmtime = { version = "=49.0.1", default-features = false, features = ["std", "runtime", "cranelift", "anyhow"] }
anyhow = "1"
tokio = { version = "1", features = ["sync"] }
[dev-dependencies]
object = { version = "=0.40.0", default-features = false, features = ["write", "read"] }
tokio = { version = "1", features = ["rt", "macros"] }
native-package-cel-guest = { path = "../package-cel-guest" }
wat = "=1.258.3"

[build-dependencies]
object = { version = "=0.40.0", default-features = false, features = ["write", "read"] }
cc = "1"
serde_json = "1"
sha2 = "0.10"

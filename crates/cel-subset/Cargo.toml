[package]
edition = "2021"
rust-version = "1.98"
name = "cel-subset"
version = "0.14.5"
authors = [
    "Clark McCauley <me@clarkmccauley.com>",
    "Alex Snaps <alex@wcgw.dev>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A parser and interpreter for the Common Expression Language (CEL)"
readme = "README.md"
categories = ["compilers"]
license = "MIT"
repository = "https://github.com/withnative/native"

[features]
bytes = ["dep:bytes"]
# `regex` and `chrono` are always on: both are required by the
# cel-subset@1 allowlist (`matches`, timestamps, durations), so they
# are plain dependencies below, not features. Keeping them optional
# would also split the test-gate scan from the compiled test set.
default = []
dhat-heap = []
# Private evidence harness and executable; no policy-construction API.
native-proof-tools = []
json = [
    "dep:base64",
]
parser_pratt = []
structs = []

[lib]
name = "cel"
path = "src/lib.rs"

[[bin]]
name = "cel-native-evidence"
path = "src/bin/native_evidence.rs"
required-features = ["native-proof-tools"]

[[bench]]
name = "parser"
path = "benches/parser.rs"
harness = false

[[test]]
name = "map_order"
path = "tests/map_order.rs"

[[bench]]
name = "runtime"
path = "benches/runtime.rs"
harness = false

[dependencies.antlr4rust]
version = "0.5.2"

[dependencies.base64]
version = "0.22.1"
optional = true

[dependencies.bytes]
version = "1"
optional = true

[dependencies.chrono]
version = "0.4"
features = [
    "alloc",
    "serde",
    "clock",
]
